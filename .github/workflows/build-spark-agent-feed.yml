
name: Build SPARK Agent Feed

# Run manually or whenever the main SPARK CSV changes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SPARK Report - SPARK Report.csv'

permissions:
  contents: write

concurrency:
  group: spark-agent-feed
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate SPARK agent feed
        run: python scripts/build_spark_feed.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("agent-data/manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          source = Path(manifest["source"]["path"])
          source_bytes = source.read_bytes()

          assert len(source_bytes) == manifest["source"]["bytes"]
          assert hashlib.sha256(source_bytes).hexdigest() == (
              manifest["source"]["sha256"]
          )

          projects = manifest["source"]["rows"]

          for section in ("index", "awards", "details"):
              total = 0

              for entry in manifest[section]["files"]:
                  path = Path(entry["path"])
                  data = path.read_bytes()

                  assert len(data) == entry["bytes"]
                  assert len(data) <= 48 * 1024
                  assert hashlib.sha256(data).hexdigest() == (
                      entry["sha256"]
                  )

                  with path.open(
                      newline="", encoding="utf-8"
                  ) as file:
                      count = sum(1 for _ in csv.DictReader(file))

                  assert count == entry["rows"]
                  total += count

              expected = (
                  manifest["awards"]["rows"]
                  if section == "awards"
                  else projects
              )
              assert total == expected
              print(f"{section}: {total} records verified")

          print("SPARK agent feed validation passed!")
          PY

      - name: Publish SPARK agent feed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only stage generated agent-data files.
          git add -A -- agent-data/

          if git diff --cached --quiet; then
            echo "No changes to the SPARK feed."
          else
            git commit -m "Update SPARK Scout agent feed"
            git push
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: spark-agent-feed-preview
          path: agent-data/
          if-no-files-found: error
          retention-days: 7
